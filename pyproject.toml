[project]
name = "brokerage-ledger-backend"
version = "0.1.0"
description = "Local-first brokerage clearing and commission ledger backend foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "pytest>=8.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
